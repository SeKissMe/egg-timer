<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>完美水煮蛋計時器 🥚</title>
    
    <!-- Open Graph / Facebook 縮圖設定 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="完美水煮蛋計時器 🥚">
    <meta property="og:description" content="自動切換 100°C 與 30°C 循環計時，幫你精準記錄次數，煮出最完美的蛋！">
    <meta property="og:image" content="https://duk.tw/Qsxbq6.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <!-- 注意：請將下面的 URL 修改為你 GitHub Pages 的實際網址 -->
    <meta property="og:url" content="https://SeKissMe.github.io/egg-timer/">

    <!-- Twitter 縮圖設定 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="完美水煮蛋計時器 🥚">
    <meta name="twitter:description" content="精準循環計時，煮蛋不再忘記次數。">
    <meta name="twitter:image" content="https://duk.tw/Qsxbq6.png">

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overscroll-behavior-y: contain;
        }
        .font-mono { font-family: 'JetBrains+Mono', monospace; }
        
        /* 避免長按圖片彈出選單 */
        img, canvas { -webkit-touch-callout: none; pointer-events: none; }
        
        .transition-opacity { transition: opacity 0.7s ease; }
    </style>
</head>
<body>

    <div id="app" class="w-full max-w-sm bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border border-gray-100 m-4">
        <!-- 標題區 -->
        <div class="pt-6 pb-2 text-center">
            <h1 class="text-2xl font-[900] text-gray-800 tracking-tight">完美水煮蛋 🥚</h1>
        </div>

        <!-- 視覺展示窗 -->
        <div id="visual-container" class="mx-5 aspect-[16/10] rounded-3xl relative overflow-hidden transition-all duration-700 border-4 border-orange-500 bg-gray-50 shadow-inner">
            <img id="cold-img" src="https://duk.tw/Qsxbq6.png" class="absolute inset-0 w-full h-full object-contain transition-opacity opacity-0 z-0" />
            <canvas id="hot-canvas" class="absolute inset-0 w-full h-full object-contain transition-opacity opacity-100 z-10"></canvas>
            
            <div id="phase-tag" class="absolute top-3 left-3 px-3 py-1 rounded-full text-[9px] font-black text-white z-20 shadow-sm uppercase tracking-widest bg-orange-600">
                100°C
            </div>
        </div>

        <!-- 資訊與按鈕區 -->
        <div class="px-6 py-4 text-center">
            <div class="flex flex-col items-center">
                <div id="cycle-label" class="bg-gray-100 text-gray-400 text-[9px] font-black px-3 py-1 rounded-full mb-3 tracking-widest uppercase">
                    Cycle 1 / 8
                </div>
                <h2 id="status-text" class="text-lg font-bold mb-1 text-gray-700">🔥 熱水加熱中</h2>
                <div id="timer-display" class="text-6xl font-mono font-black text-gray-800 leading-none my-4 tracking-tighter drop-shadow-sm">
                    02:00
                </div>
            </div>

            <!-- 控制按鈕組 -->
            <div class="space-y-3">
                <button id="main-btn" class="w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-white font-black text-xl shadow-lg active:scale-95 transition-all bg-orange-500 shadow-orange-100">
                    <span id="play-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
                    <span id="main-btn-text">開始煮蛋</span>
                </button>
                
                <div class="grid grid-cols-2 gap-3">
                    <button id="reset-btn" class="py-3 rounded-xl bg-gray-50 text-gray-500 font-bold border border-gray-100 active:bg-gray-100 transition-colors flex items-center justify-center gap-2 text-xs">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        重設此段
                    </button>
                    <button id="skip-btn" class="py-3 rounded-xl bg-gray-50 text-gray-500 font-bold border border-gray-200 flex items-center justify-center gap-2 text-xs active:bg-gray-100 transition-colors">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        跳過
                    </button>
                </div>
            </div>
        </div>

        <!-- 進度條 -->
        <div id="progress-container" class="px-8 pb-6 flex gap-1">
            <!-- 進度點會由 JS 動態生成 -->
        </div>
    </div>

    <script>
        // --- 設定 ---
        const HOT_VIDEO_URL = "https://res.cloudinary.com/dcoswk3cu/video/upload/v1/A148AC21-F390-40B5-BB35-F427316EB68C_wai3kr.mp4";
        const STEP_TIME = 120;
        const TOTAL_CYCLES = 8;

        // --- 狀態 ---
        let timeLeft = STEP_TIME;
        let currentCycle = 1;
        let isHot = true;
        let isRunning = false;
        let isFinished = false;
        let isVideoUnlocked = false;

        // --- DOM 元素 ---
        const timerDisplay = document.getElementById('timer-display');
        const statusText = document.getElementById('status-text');
        const cycleLabel = document.getElementById('cycle-label');
        const mainBtn = document.getElementById('main-btn');
        const mainBtnText = document.getElementById('main-btn-text');
        const playIconContainer = document.getElementById('play-icon');
        const visualContainer = document.getElementById('visual-container');
        const coldImg = document.getElementById('cold-img');
        const hotCanvas = document.getElementById('hot-canvas');
        const phaseTag = document.getElementById('phase-tag');
        const progressContainer = document.getElementById('progress-container');
        const ctx = hotCanvas.getContext('2d');

        // --- 影片物件 (記憶體中) ---
        const secretVideo = document.createElement('video');
        secretVideo.src = HOT_VIDEO_URL;
        secretVideo.muted = true;
        secretVideo.playsInline = true;
        secretVideo.crossOrigin = "anonymous";
        secretVideo.preload = "auto";

        // --- 圖標 ---
        const iconPlay = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const iconPause = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        // --- 初始化進度條 ---
        function initProgress() {
            progressContainer.innerHTML = '';
            for (let i = 1; i <= TOTAL_CYCLES; i++) {
                const dot = document.createElement('div');
                dot.id = `dot-${i}`;
                dot.className = 'h-1.5 flex-1 rounded-full transition-all duration-1000 bg-gray-200';
                progressContainer.appendChild(dot);
            }
        }
        initProgress();

        // --- UI 更新 ---
        function updateUI() {
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.innerText = isFinished ? "DONE" : `${m}:${s.toString().padStart(2, '0')}`;
            cycleLabel.innerText = `Cycle ${currentCycle} / ${TOTAL_CYCLES}`;

            // 進度點更新
            for (let i = 1; i <= TOTAL_CYCLES; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentCycle || isFinished) {
                    dot.className = 'h-1.5 flex-1 rounded-full transition-all duration-1000 bg-emerald-500';
                } else if (i === currentCycle) {
                    dot.className = 'h-1.5 flex-1 rounded-full transition-all duration-1000 bg-orange-400 animate-pulse';
                } else {
                    dot.className = 'h-1.5 flex-1 rounded-full transition-all duration-1000 bg-gray-200';
                }
            }

            if (isFinished) {
                statusText.innerText = "🎉 煮蛋完成！";
                statusText.className = "text-lg font-bold mb-1 text-emerald-600";
                mainBtn.className = "w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-white font-black text-xl shadow-lg active:scale-95 transition-all bg-emerald-500 shadow-emerald-100";
                mainBtnText.innerText = "重新開始";
                visualContainer.className = "mx-5 aspect-[16/10] rounded-3xl relative overflow-hidden transition-all duration-700 border-4 border-emerald-500 bg-gray-50 shadow-inner";
                phaseTag.innerText = "SUCCESS";
                phaseTag.className = "absolute top-3 left-3 px-3 py-1 rounded-full text-[9px] font-black text-white z-20 shadow-sm uppercase tracking-widest bg-emerald-500";
                coldImg.className = "absolute inset-0 w-full h-full object-contain transition-opacity opacity-100 z-10";
                hotCanvas.className = "absolute inset-0 w-full h-full object-contain transition-opacity opacity-0 z-0";
            } else {
                if (isHot) {
                    statusText.innerText = "🔥 熱水加熱中";
                    visualContainer.className = "mx-5 aspect-[16/10] rounded-3xl relative overflow-hidden transition-all duration-700 border-4 border-orange-500 bg-gray-50 shadow-inner shadow-orange-50";
                    phaseTag.innerText = "100°C";
                    phaseTag.className = "absolute top-3 left-3 px-3 py-1 rounded-full text-[9px] font-black text-white z-20 shadow-sm uppercase tracking-widest bg-orange-600";
                    coldImg.className = "absolute inset-0 w-full h-full object-contain transition-opacity opacity-0 z-0";
                    hotCanvas.className = "absolute inset-0 w-full h-full object-contain transition-opacity opacity-100 z-10";
                } else {
                    statusText.innerText = "❄️ 冷水降溫中";
                    visualContainer.className = "mx-5 aspect-[16/10] rounded-3xl relative overflow-hidden transition-all duration-700 border-4 border-sky-400 bg-gray-50 shadow-inner shadow-sky-50";
                    phaseTag.innerText = "30°C";
                    phaseTag.className = "absolute top-3 left-3 px-3 py-1 rounded-full text-[9px] font-black text-white z-20 shadow-sm uppercase tracking-widest bg-sky-500";
                    coldImg.className = "absolute inset-0 w-full h-full object-contain transition-opacity opacity-100 z-10";
                    hotCanvas.className = "absolute inset-0 w-full h-full object-contain transition-opacity opacity-0 z-0";
                }

                if (isRunning) {
                    mainBtnText.innerText = "暫停計時";
                    playIconContainer.innerHTML = iconPause;
                    mainBtn.className = "w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-white font-black text-xl shadow-lg active:scale-95 transition-all bg-amber-500 shadow-amber-100";
                } else {
                    mainBtnText.innerText = timeLeft === STEP_TIME && currentCycle === 1 ? "開始煮蛋" : "繼續計時";
                    playIconContainer.innerHTML = iconPlay;
                    mainBtn.className = "w-full py-4 rounded-2xl flex items-center justify-center gap-2 text-white font-black text-xl shadow-lg active:scale-95 transition-all bg-orange-500 shadow-orange-100";
                }
            }
        }

        // --- 計時器邏輯 ---
        setInterval(() => {
            if (isRunning && timeLeft > 0) {
                timeLeft--;
                updateUI();
                if (timeLeft === 0) handleStepEnd();
            }
        }, 1000);

        function handleStepEnd() {
            playBeep();
            if (isHot) {
                isHot = false;
                timeLeft = STEP_TIME;
            } else {
                if (currentCycle < TOTAL_CYCLES) {
                    currentCycle++;
                    isHot = true;
                    timeLeft = STEP_TIME;
                } else {
                    isFinished = true;
                    isRunning = false;
                }
            }
            updateUI();
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        // --- 動畫渲染 ---
        let lastTimestamp = 0;
        let scrubTime = 0;

        function render(timestamp) {
            if (isRunning && isHot && !isFinished) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const delta = (timestamp - lastTimestamp) / 1000;
                lastTimestamp = timestamp;

                scrubTime = (scrubTime + delta) % 3;
                
                if (secretVideo.readyState >= 2) {
                    secretVideo.currentTime = scrubTime;
                    if (hotCanvas.width !== secretVideo.videoWidth) {
                        hotCanvas.width = secretVideo.videoWidth;
                        hotCanvas.height = secretVideo.videoHeight;
                    }
                    ctx.drawImage(secretVideo, 0, 0, hotCanvas.width, hotCanvas.height);
                }
            } else {
                lastTimestamp = 0;
            }
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        // --- 控制功能 ---
        mainBtn.onclick = () => {
            if (isFinished) {
                location.reload();
                return;
            }
            // 解鎖影片引擎
            if (!isVideoUnlocked) {
                secretVideo.play().then(() => {
                    secretVideo.pause();
                    isVideoUnlocked = true;
                }).catch(() => {});
            }
            isRunning = !isRunning;
            updateUI();
        };

        document.getElementById('reset-btn').onclick = () => {
            timeLeft = STEP_TIME;
            scrubTime = 0;
            updateUI();
        };

        document.getElementById('skip-btn').onclick = () => {
            if (!isFinished) handleStepEnd();
        };

        updateUI();
    </script>
</body>
</html>
